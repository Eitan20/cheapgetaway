          - button "Read the full story" [ref=f13e508] [cursor=pointer]
          - generic: "My trip to the amazing island of Menorca was an unforgettable vacation. The Balearic Sea is stunning, and the bay is so beautiful it's beyond words. I'm grateful to Travorium and its founder, David Hart, for allowing me to witness such a miracle. The hotel is luxurious, with every amenity, and I especially loved the bracelet that opens the door to my room. It's so convenient, you don't have to carry a card. The view from the balcony reveals the stunning beauty of the sea and bay. The water is so clear that you can see the entire depth. There are also magnificent reefs that you never tire of admiring. The all-inclusive system and buffet offer a huge selection of food, which were never the same over the course of five days. Drinks are complimentary by the pool and at the bar. Every evening, there were concerts in the lobby area, where the performers reflected the culture and hospitality of Spain. If someone asked me: 'Will you come back again?' I would confidently answer: 'Yes, yes, yes…'"
      - generic [ref=f13e509]:
