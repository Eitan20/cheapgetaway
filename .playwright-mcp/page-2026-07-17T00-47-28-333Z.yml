          - generic: Мировой тур от компании Travorium 22–28 сентября ✨ Дубай. Наше незабываемое путешествие началось в тот момент, когда самолёт мягко приземлился. В отеле Aloft нас приветствовали молодые, внимательные менеджеры. Каждое утро начиналось с золотистых лучей солнца и величественного вида на Бурдж-Халифу. Мы искренне благодарим компанию Travorium за возможность увидеть Дубай, ощутить его магию и открыть для себя мир, о котором раньше только мечтали. ✨
      - generic [ref=f13e678]:
