          - generic: Je suis partie en voyage solo avec plusieurs étapes et le world tours à Phuket était au milieu de mon voyage. J'avais pour but le repos, profiter de la mer, des massages et de la vie locale. L'hotel est splendide, grand mais avec plusieurs partie ce qui fait qu'on était au calme. J'ai aimé les petites piscines sous forme de couloir de nage, ombragés. Que dire des petits déjeuners! Servis dans 2 restaurants, je n'ai jamais vu un si grand nombre de plats différents, que ce soit des viennoiseries, des plats thaïlandais, japonais, même des poissons entiers! J'ai fait la connaissance d'une partenaire canadienne. Le fait que l'hôtel soit situé au nord de la plage de Patong est appréciable car on est proche des restaurants sans être sur la partie trop bondée des plages. J'ai aimé me balader au coucher du soleil le long de la plage tout en profitant du street food.
