            - paragraph [ref=f16e414]: Breakfast was good. Nice hit meal. Large variety of food options. Our initial agent at check in was not very friendly. We checked in around 12:45. She said there were no rooms ready. She said we would need to come back after 2p. I asked if she could call to let us know when our room was available. She didn’t even look up when she said “no, just come back at 2”. When we did come back the new agent (Bri) was very nice and pleasant. Very friendly. She did inform us the room was on the airport side. We were not impacted by noise.
    - generic [ref=f16e415]:
      - heading "Property description" [level=2] [ref=f16e416]
      - paragraph [ref=f16e417]: Convenient Location Located just minutes away from McCarran International Airport and the vibrant Las Vegas Strip, our hotel offers the perfect blend of accessibility and excitement. Modern Amenities Enjoy a comfortable stay in our completely non-smoking guestrooms equipped with flat-screen TVs. Start your day right with our complimentary hot breakfast and take advantage of our free airport shuttle service running daily from 4am to 11pm. Leisure Facilities Relax by the outdoor pool, stay active in the 24-hour fitness center, and grab essentials at our on-site convenience store. Whether you're here for business or leisure, Hampton Inn &amp; Suites Las Vegas Airport has everything you need for a memorable stay. Book now for an unforgettable experience at our Las Vegas getaway.
