          - generic: Le séjour était juste sublime ! J'ai été impactée et impressionnée par l'hôtel 4 étoiles dans lequel nous séjournions. Cet hôtel est vraiment ludique il y avait plusieurs décoration et deux réceptions différentes qui était disponible, acceuil chaleureux et convivial ! Ce séjour c'est déroulée lors de la convention internationale de la société ce qui était particulièrement satisfaisant ! J'ai rencontrer plusieurs membres sur place et partager des petits moments extrêmement sympathique ! La piscine sur le toit de l'hôtel était trop cool j'ai adoré passer ces moment unique et ne parlons pas du petit déjeuner hyper complet à disposition ! Nous avons eu un verre offert d'accueil cela a été très apprécié par moi et mon conjoint ! Nous avons visité Barceloneta beach et j'ai partager cela en direct avec ma famille ce qui a été très émouvant car mes parents on vécu 10 ans à Barcelone et ce sont rencontrer sur cette place ! Une expérience unique et mon premier world tour sur les traces familial ! Merci à travorium et à tous les membres pour ces partages exceptionnel !
