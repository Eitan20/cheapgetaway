          - generic: "Поехала отдыхать с четырьмя детьми — и отель приятно удивил. Нам сделали апгрейд до виллы. Просторно, удобно, с детьми — идеально. Еда разнообразная, подходит и для малышей. Сервис внимательный: вечером приносят печенье и молоко. По страховке можно вызвать врача прямо в отель. Пляж чистый, море тёплое. Благодарю Travorium за возможность показать детям такой уровень комфорта и безопасности. Отдых получился полноценным и запоминающимся — и это самое важное."
