          - generic: "J'ai passé un séjour merveilleux à Prague ! Une expérience unique que j'ai pu vivre avec ma maman. Un hôtel très classe, un petit-déjeuner buffet et le gros + : l'accès direct au métro depuis l'hôtel ! Nous avons découvert les spécialités culinaires locales ainsi que les activités et le patrimoine. J'en garderai un souvenir à vie, car c'est la première fois que je partage un voyage avec ma maman. Je suis ravie d'avoir pu lui offrir, merci Travorium et diky Praha ! I had a wonderful stay in Prague! A unique experience I was able to share with my mother. A very classy hotel, a buffet breakfast, and the best part: direct access to the metro from the hotel! We discovered local culinary specialties as well as activities and heritage sites. I will cherish the memory forever, as it was the first time I shared a trip with my mother. I am delighted to have been able to give her this experience, thank you Travorium and diky Praha!"
