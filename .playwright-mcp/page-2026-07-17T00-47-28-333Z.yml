          - button "Read the full story" [ref=f13e573] [cursor=pointer]
          - generic: Un magnifique World Tour à Málaga ! Un moment hors du temps dans un superbe hôtel. Une vue sur la mer incroyable. J'ai eu la chance d'emmener ma maman et de voir sur place des personnes que je connaissais ainsi que de faire de nouvelles rencontres. La ville est magnifique, un vrai coup de cœur. Merci Travorium ! A magnificent World Tour in Malaga! A truly timeless experience in a superb hotel. An incredible sea view. I was lucky enough to bring my mother along and see people I knew while I was there, as well as making new friends. The city is magnificent, I absolutely loved it. Thank you Travorium!
      - generic [ref=f13e574]:
