          - generic: This romantic getaway allowed us to slow down, relax, and explore the surrounding area. The resort, simply magnificent, provided the perfect setting for many wonderful moments spent by the pool, at the spa, and on the beach, undoubtedly the most beautiful we've ever seen. We also enjoyed exceptional comfort in our studio, which featured a whirlpool tub. We rented a car to explore the underwater world while snorkeling at various beaches, including Crystal Beach, Paradise Cove, Gold Rock Beach, and Banana Bay. A private boat trip to Peterson Cay was another highlight of our stay. Finally, the free ferry offered by the hotel allowed us to visit the Lucaya Marketplace, where we enjoyed some delicious meals.
