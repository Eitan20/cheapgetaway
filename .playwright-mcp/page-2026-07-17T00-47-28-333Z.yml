          - button "Read the full story" [ref=f13e1191] [cursor=pointer]
          - generic: Quel voyage! Mon huitième de l'année, tout ça grâce a Travorium. Ce séjour au Caire je l'avais toujours promis à mon fils, ma raison de vivre. Ce séjour a été une découverte de culture et nous avons des leçons à prendre! Totalement adepte des world Tour, cet hôtel était splendide, le personnel aux petits soins, un hôtel qui mérite ses 5 étoiles. Un hôtel que je n'aurais pu m'offrir sans Travorium et son épargne voyage. Nous avons pu disposer d'une très belle chambre, des espaces reposant aussi bien en intérieur qu'en extérieur, des piscines et tant d'autres choses. Nous avons visité les pyramides avec un guide qui nous a permis d'apprendre énormément, le nouveau musée du Caire avec les pièces uniques de Touthankamon, le souk en soirée avec ses couleurs et ses lumières et une promenade en felouque sur le Nil… What a trip! My eighth of the year, all thanks to Travorium. I had always promised this trip to Cairo to my son, my reason for living. This trip was a cultural discovery, and we learned so much! A total fan of world tours, this hotel was splendid, the staff were incredibly attentive, a hotel that truly deserves its 5 stars. A hotel I wouldn't have been able to afford without Travorium and its travel savings program. We had a beautiful room, relaxing spaces both indoors and outdoors, swimming pools, and so much more. We visited the pyramids with a guide who helped us learn a great deal, the new Cairo Museum with its unique Tutankhamun artifacts, the souk in the evening with its vibrant colors and lights, and a felucca ride on the Nile… Thank you, David and Adela, thank you!
