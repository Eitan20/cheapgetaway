          - button "Read the full story" [ref=f13e1209] [cursor=pointer]
          - generic: I had a blast on my first solo international trip! I went for my birthday and my flabbers were fasted at the amazing service. The hotel was at the world renowned 5star resort Jumeirah Gulf of Bahrain. The food was top notch, i literally looked forward to every meal. I was randomly upgraded to full board meaning all food was included. The room was quaint but very nice. They decorated my room for my birthday with balloons and also gifted me a tasty cake. Bahrain is neighbors to Qatar and Saudi Arabia. I took a day trip to Saudi Arabia and had a really nice traditional Saudi dinner. I also decided to fly on Etihad and they have an amazing stopover program that gifts you 1-2 additional days in Abu Dhabi at no extra charge. They even pay for you to stay in a 4 star hotel of your choice. I did everything under the sun, and trust me, the sun is OUT lol! My first trip to the Middle East but it certainly won't be my last! I cannot wait to go back!
