          - generic: Hello dears travelers ! 💚⚓️ We had a great time in Florida from February 26th to March 5th. My friend and I, from Canada (Quebec), were in holidays for Spring break and enjoyed our stay with the business. It all made sense to be at the convention and see successful people cheering up their team ! We stayed 3 nights at Doubletree Hilton by Seaworld where we saved 50$ each night with Travorium. We also rent a car for the week and stayed at Park Royal Hotel, Kissimmee. Clean, well located, outside pool, gym, very close to Disney and safe place. Breakfast was included everyday. We spent one day in Daytona Beach where we drove on the sand and one day in Cocoa Beach around Cap Canaveral. Sunsets where amazing with the full moon. Weather was perfect. ♡
