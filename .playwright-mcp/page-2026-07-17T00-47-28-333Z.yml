          - generic: "Un Getaway génial à Gran Canaria. L'hôtel club Cala Blanca à Taurito était parfait, nous avions un appartement avec chambre (lit king size), cuisine équipée, salon, salle de bain et une superbe terrasse avec vue sur mer. Un cadre magnifique et idéal pour se retrouver en amoureux après la naissance de notre fils. On a profité de la piscine, de la plage (au sable volcanique) et d'une ambiance vraiment relaxante. Nous avons aussi découvert le Roque Nublo et un superbe \"mini Grand Canyon\" au centre de l'île : des paysages impressionnants qui nous ont vraiment marqués. Un séjour ressourçant, dépaysant et une très belle expérience grâce à Travorium ! Donc tout simplement MERCI! A fantastic getaway to Gran Canaria. The Cala Blanca Club Hotel in Taurito was perfect. We had an apartment with a bedroom (king-size bed), a fully equipped kitchen, a living room, a bathroom, and a superb terrace with a sea view. A magnificent setting, ideal for a romantic getaway after the birth of our son. We enjoyed the pool, the beach (with its volcanic sand), and a truly relaxing atmosphere. We also discovered Roque Nublo and a stunning \"mini Grand Canyon\" in the center of the island: breathtaking landscapes that truly impressed us. A rejuvenating and refreshing stay, and a wonderful experience thanks to Travorium! So, simply, THANK YOU!"
