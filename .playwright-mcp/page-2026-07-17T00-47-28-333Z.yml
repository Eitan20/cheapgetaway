          - button "Read the full story" [ref=f13e586] [cursor=pointer]
          - generic: Je suis complètement tombée sous le charme du Brésil ! L'hôtel était juste incroyable, un Getaway en 5 étoiles 🥰 super bien situé et confortable. L'Hôtel Nacional Rio, perché à São Conrado, offre une vue spectaculaire sur la mer et les montagnes, et se trouve à deux pas de la Rocinha, la plus grande favela d'Amérique latine. Construit dans les années 1940, cet hôtel emblématique a accueilli des célébrités et des événements historiques, mêlant luxe et histoire brésilienne. Chaque moment passé là-bas était un vrai bonheur… Je compte déjà y retourner 🥰 I completely fell in love with Brazil! The hotel was simply incredible, a 5-star Getaway 🥰 super well located and comfortable. The Hotel Nacional Rio, perched in São Conrado, offers spectacular views of the sea and mountains, and is just a stone's throw from Rocinha, the largest favela in Latin America. Built in the 1940s, this iconic hotel has hosted celebrities and historical events, blending luxury with Brazilian history. Every moment spent there was pure bliss… I'm already planning my return 🥰
